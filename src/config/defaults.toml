# Vandamme Proxy Configuration
# This file contains default configuration values and fallback aliases
# These are used when users haven't explicitly configured them via environment variables

# ============================================================================
# PROFILES
# ============================================================================
# Profiles are reusable configuration presets that bundle timeout, retry, and
# alias settings. Use profile prefix in requests: "profile-name:model"
#
# === PROFILE SYNTAX ===
# Use [profiles.name] syntax to define profiles:
#   [profiles.myprofile]
#   timeout = 100
#   [profiles.myprofile.aliases]
#   haiku = "zai:haiku"
#
# Legacy syntax ["#name"] is deprecated but still supported.
#
# === PROFILE-PROVIDER COLLISION IS INTENTIONAL BEHAVIOR ===
# When a profile name matches a provider name (case-insensitive), the profile
# takes precedence for requests using "name:model" prefix.
#
# Example:
#   TOML defines [profiles.openai] profile with aliases
#   Provider named "openai" also exists
#   Request "openai:haiku" uses the PROFILE's aliases, not the provider's
#
# This allows creating custom provider overrides without changing underlying
# provider configuration.
# ============================================================================

# ============================================================================
# See https://swe-rebench.com/?insight=dec_2025 to help choose your models
# ============================================================================

[defaults]
# Default target to use when not specified via environment variable
# Can be overridden by VDM_DEFAULT_TARGET environment variable
default-target = "top"

# Global fallback values for providers
# These are used when a provider doesn't define its own value.
# Precedence: environment variable > provider config > defaults > error
timeout = 90
max-retries = 3

# Global fallback aliases that apply to all providers
# These are used when a provider doesn't have a provider-specific alias.
# Precedence: {PROVIDER}_ALIAS_{NAME} env > [provider.aliases] > [defaults.aliases] > not found
[defaults.aliases]
per-message = "poe:per-message"
# WHY these use chained aliases (e.g. "zai:haiku" not raw model names): updating
# [zai.aliases] or [opencodego.aliases] automatically updates all profiles and
# defaults that reference them — one change point instead of N.
haiku = "zai:haiku"
sonnet = "zai:sonnet"
# WHY opus/long route to opencodego (flat-rate) instead of zai (per-token):
# high-tier models are expensive on token billing but free on Go's flat-rate quota.
opus = "opencodego:kimi-k2.6"
long = "opencodego:mimo-v2.5-pro"
personalagent = "zai:personalagent"
docs = "!poe:ds"

# ============================================================================
# Profiles
# ============================================================================

[profiles.main]
timeout = 100
[profiles.main.aliases]
haiku = "zai:haiku"
sonnet = "poe:gemini-flash"
opus = "agentrouter:opus"

[profiles.top]
# Optimized for quick coding iterations
timeout = 120
max-retries = 4
[profiles.top.aliases]
# WHY mirrors [defaults.aliases] exactly: keeps "top" profile as the authoritative
# routing table. If you need a different routing, diverge intentionally here.
haiku = "zai:haiku"
sonnet = "zai:sonnet"
opus = "opencodego:kimi-k2.6"
long = "opencodego:mimo-v2.5-pro"
personalagent = "zai:personalagent"

# ============================================================================
# Providers
# ============================================================================

# OpenAI provider defaults
[openai]
base-url = "https://api.openai.com/v1"
models-url = "https://platform.openai.com/docs/models"
api-format = "openai"
timeout = 90
max-retries = 2
[openai.aliases]
haiku = "gpt-5.1-mini"
sonnet = "gpt-5.1-codex"
opus = "gpt-5.2"
extract = "gpt-4o"

# ChatGPT subscription provider — uses internal Responses API at chatgpt.com
# (not the public OpenAI API at api.openai.com). Requires OAuth: `vdm oauth login chatgpt`
# Streaming-only: the Responses API rejects non-streaming requests.
# Model names are ChatGPT-specific — standard OpenAI model names (gpt-4o, o4-mini) are rejected.
[chatgpt]
base-url = "https://chatgpt.com/backend-api/codex"
models-url = "https://chatgpt.com"
api-format = "responses"
auth-mode = "oauth"
timeout = 300
max-retries = 2
[chatgpt.aliases]
# Confirmed working via spike test (2026-03-25). Model availability may change.
haiku = "gpt-5"
sonnet = "gpt-5.2-codex"
opus = "gpt-5.2"

# Poe provider defaults
[poe]
base-url = "https://api.poe.com/v1"
models-url = "https://poe.com/explore?category=Programming"
# Only used if POE_MODEL_PAGE is empty
model-page = "https://poe.com/{display_name}/api"
api-format = "openai"
timeout = 90
max-retries = 2
[poe.aliases]
haiku = "gpt-5.1-mini"
sonnet = "gpt-5.1-codex-mini"
opus = "gpt-5.1-codex-max"
cheap = "grok-4.1-fast-reasoning"
fast = "grok-4.1-fast-non-reasoning"
top = "gpt-5.2"
gemini-flash = "gemini-3-flash"
ds = "deepseek-v3.2"
docs = "ds"
per-message = "glm-4.7"
# https://www.prollm.ai/leaderboard/entity-extraction
extract  = "claude-sonnet-4"
extract2 = "grok-4"
extract3 = "gpt-4o"
extract4 = "mistral-small-3.1"
# https://www.prollm.ai/leaderboard/summarization?language=english&level=advanced,basic
summary = "gpt-5"
summary2 = "gpt-5-nano"

# OpenRouter provider defaults
[openrouter]
base-url = "https://openrouter.ai/api/v1"
models-url = "https://openrouter.ai/models"
# Only used if OPENROUTER_MODEL_PAGE is empty
model-page = "https://openrouter.ai/{id}"
api-format = "openai"
timeout = 90
max-retries = 2
[openrouter.aliases]
haiku = "openai/gpt-5.1-codex-mini"
sonnet = "openai/gpt-5.1-codex-mini"
opus = "openai/gpt-5.1-codex-max"
free   = "kwaipilot/kat-coder-pro:free"
free1  = "mistralai/devstral-2512:free"
cheap  = "minimax/minimax-m2.1"
cheap1 = "xiaomi/mimo-v2-flash:free"
cheap2 = "openai/gpt-oss-120b:free"
cheap3 = "qwen/qwen3-coder:free"
top = "openai/gpt-5.2"

[cerebras]
base-url = "https://api.cerebras.ai/v1"
models-url = "https://www.cerebras.ai/pricing"
api-format = "openai"
[cerebras.aliases]

[nanogpt]
base-url = "https://nano-gpt.com/api/v1"
models-url = "https://nano-gpt.com/pricing"
api-format = "openai"
[nanogpt.aliases]
minimax = "minimax/minimax-m2.1"
ds = "deepseek-v3.2-thinking-original"
kimi = "moonshotai/Kimi-K2-Instruct-0905"
gemini-flash = "google/gemini-3-flash-preview-thinking"
haiku = "zai-org/glm-4.7-flash-original:thinking"
sonnet = "kimi"
opus = "zai-org/glm-4.7-original:thinking"
opus-e = "gemini-flash"
docs = "ds"

[agentrouter]
base-url = "https://agentrouter.org/v1"
models-url = "https://agentrouter.org/pricing"
api-format = "openai"
timeout = 90
max-retries = 2
[agentrouter.aliases]
ds = "deepseek-v3.2"
glm = "glm-4.6"
docs = "ds"
haiku = "glm"
sonnet = "glm"
opus = "claude-opus-4-5-20251101"

[agentroutera]
base-url = "https://agentrouter.org"
models-url = "https://agentrouter.org/pricing"
api-format = "anthropic"
timeout = 90
max-retries = 2
[agentroutera.aliases]
haiku = "claude-haiku-4-5-20251001"
sonnet = "claude-sonnet-4-5-20250929"
opus = "claude-opus-4-5-20251101"

# Z.AI provider defaults (Anthropic-compatible)
[zai]
base-url = "https://api.z.ai/api/anthropic"
api-format = "anthropic"
timeout = 90
max-retries = 2
[zai.aliases]
# WHY GLM-4.7-Flash for haiku (not GLM-5): Flash is faster and cheaper for
# routine tasks; GLM-5's reasoning capabilities are wasted on haiku-tier work.
haiku = "GLM-4.7-Flash"
sonnet = "GLM-5-Turbo"
opus = "GLM-5.1"
# GLM 5 Turbo is specifically optimized for the OpenClaw scenario. It has been trained to enhance capabilities crucial for OpenClaw tasks,
# such as tool invocation, command following, timed and persistent tasks, and long-chain execution
# https://docs.z.ai/guides/llm/glm-5-turbo#:~:text=Overview%20GLM-5-Turbo%20is,and%20long-chain%20execution.
personalagent = "GLM-5-Turbo"

# Z.AI OpenAI-compatible provider defaults
[zaio]
base-url = "https://api.z.ai/api/coding/paas/v4"
api-format = "openai"
timeout = 90
max-retries = 2
[zaio.aliases]
haiku = "GLM-4.5-Air"
sonnet = "GLM-4.7"
opus = "GLM-4.7"

# Kimi provider defaults
[kimi]
base-url = "https://api.kimi.com/coding/v1"
models-url = "https://kimi-ai.chat/models/"
api-format = "openai"
timeout = 90
max-retries = 2
tool-name-sanitization = true
reasoning-content-passthrough = true
[kimi.aliases]
haiku = "kimi-k2-thinking-turbo"
sonnet = "kimi-k2-thinking-turbo"
opus = "kimi-k2-thinking-turbo"

[deepseek]
base-url = "https://api.deepseek.com"
models-url = "https://api-docs.deepseek.com/quick_start/pricing"
api-format = "openai"
timeout = 90
max-retries = 2
[deepseek.aliases]
haiku = "deepseek-chat"
sonnet = "deepseek-reasoner"
opus = "deepseek-reasoner"

[longcat]
base-url = "https://api.longcat.chat/openai/v1"
models-url = "https://longcat.chat/platform/docs/#supported-models"
api-format = "openai"
[longcat.aliases]
haiku = "LongCat-Flash-Chat"
sonnet = "LongCat-Flash-Thinking"
opus = "LongCat-Flash-Thinking-2601"

[longcata]
base-url = "https://api.longcat.chat/anthropic"
models-url = "https://longcat.chat/platform/docs/#supported-models"
api-format = "anthropic"
[longcata.aliases]
haiku = "LongCat-Flash-Chat"
sonnet = "LongCat-Flash-Thinking"
opus = "LongCat-Flash-Thinking-2601"

# Anthropic provider defaults
[anthropic]
base-url = "https://api.anthropic.com"
models-url = "https://platform.claude.com/docs/en/about-claude/models/overview"
api-format = "anthropic"
timeout = 90
max-retries = 2
[anthropic.aliases]
haiku = "claude-3-5-haiku-20241022"
sonnet = "claude-3-5-sonnet-20241022"
opus = "claude-3-opus-20240229"

# OpenCode Zen — multi-provider aggregator charged per token (not flat rate).
# WHY models from GPT/Claude/Gemini coexist here: Zen routes to whichever provider
# owns the model, so you get one API key for multiple providers.
[opencode]
base-url = "https://opencode.ai/zen/v1"
api-format = "openai"
timeout = 90
max-retries = 2
[opencode.aliases]
# WHY haiku/sonnet/opus map to GPT, not their namesake families: these are
# cost-optimized picks for coding proxies where GPT codex models outperform
# Claude/Gemini at the same price tier for code generation tasks.
haiku = "gpt-5.1-codex-mini"
sonnet = "gpt-5.3-codex"
opus = "claude-opus-4-7"
# Free-tier models (zero cost, lower quality). Useful for bulk non-critical tasks.
free = "big-pickle"
free1 = "ling-2.6-flash-free"
free2 = "nemotron-3-super-free"
mini = "gpt-5.4-mini"
nano = "gpt-5.4-nano"
# Family shortcuts — each points to the latest available model from that family.
# DECISION: these default to the strongest model per family, not the cheapest.
# Revisit if cost matters more than quality for your workload.
claude = "claude-opus-4-7"
gpt = "gpt-5.4-pro"
gemini = "gemini-3.1-pro"
glm = "glm-5.1"
kimi = "kimi-k2.6"
minimax = "minimax-m2.7"
qwen = "qwen3.6-plus"
# GPT codex variants — differ in speed vs. depth tradeoff.
# codex: balanced, codex-max: deepest reasoning, spark: fastest responses.
codex = "gpt-5.3-codex"
codex-max = "gpt-5.1-codex-max"
spark = "gpt-5.3-codex-spark"

# OpenCode Go — flat-rate plan (no per-token billing). All models share one quota.
# Quota tiers (req/5h, as of 2026-04): qwen3.5-plus=10,200 > minimax-m2.7=3,400 >
# kimi-k2.6=1,150 > mimo-v2.5-pro=1,290 > glm-5.1=880.
# WHY aliases map to quota tiers, not model families: on a flat-rate plan, the
# "cheapest" alias should maximize quota, not minimize token cost.
[opencodego]
base-url = "https://opencode.ai/zen/go/v1"
api-format = "openai"
timeout = 90
max-retries = 2
reasoning-content-passthrough = true
[opencodego.aliases]
# WHY haiku=qwen3.5-plus (not GLM-5.1): qwen3.5-plus has 10,200 req/5h — 12x more
# quota than GLM-5.1 (880). On flat-rate, volume beats quality for "haiku" tasks.
haiku = "qwen3.5-plus"
sonnet = "minimax-m2.7"
opus = "kimi-k2.6"
# GOTCHA: mimo-v2.5-pro has 1M context window but only 1,290 req/5h quota.
# Reserve for tasks that actually need long context; don't use as a default.
long = "mimo-v2.5-pro"
# Free-tier models — same zero-cost models as Zen, but here they eat Go plan quota.
free = "big-pickle"
free1 = "ling-2.6-flash-free"
free2 = "nemotron-3-super-free"
# Family shortcuts — each points to the latest available model from that family.
glm = "glm-5.1"
kimi = "kimi-k2.6"
mimo = "mimo-v2.5-pro"
minimax = "minimax-m2.7"
qwen = "qwen3.6-plus"

